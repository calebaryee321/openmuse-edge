name: Android UI smoke

on:
  push:
    branches:
      - feature/openmuse-edge-v0
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  android-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Download previously built APK artifact
        uses: actions/download-artifact@v4
        with:
          name: openmuse-android-smoke
          path: ${{ runner.temp }}/apk-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: calebaryee321/openmuse-edge
          run-id: 37331886172

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find "$RUNNER_TEMP/apk-source" -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Boot emulator, install APK, launch and capture UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euxo pipefail
            mkdir -p "$RUNNER_TEMP/android-ui-smoke"

            nohup pnpm --dir apps/mobile exec expo start --dev-client --localhost --port 8081               > "$RUNNER_TEMP/android-ui-smoke/metro.log" 2>&1 &

            timeout 120 bash -c 'until curl -fsS http://127.0.0.1:8081 >/dev/null; do sleep 2; done'

            adb reverse tcp:8081 tcp:8081
            adb install -r "${{ steps.apk.outputs.path }}"

            adb logcat -c
            adb shell monkey -p app.openmuse.mobile -c android.intent.category.LAUNCHER 1
            sleep 25

            PID="$(adb shell pidof app.openmuse.mobile | tr -d '\r')"
            test -n "$PID"
            echo "OpenMuse PID: $PID"

            adb shell uiautomator dump /sdcard/openmuse-ui.xml
            adb pull /sdcard/openmuse-ui.xml "$RUNNER_TEMP/android-ui-smoke/openmuse-ui.xml"
            adb exec-out screencap -p > "$RUNNER_TEMP/android-ui-smoke/openmuse-screen.png"
            adb logcat -d > "$RUNNER_TEMP/android-ui-smoke/logcat.txt"
            adb shell dumpsys activity activities > "$RUNNER_TEMP/android-ui-smoke/activity.txt"

            test -s "$RUNNER_TEMP/android-ui-smoke/openmuse-screen.png"
            test -s "$RUNNER_TEMP/android-ui-smoke/openmuse-ui.xml"

            grep -Eq 'Welcome to OpenMuse|Open workspace|A little room for your day'               "$RUNNER_TEMP/android-ui-smoke/openmuse-ui.xml"

            if grep -E 'FATAL EXCEPTION:|AndroidRuntime:.*Process: app\.openmuse\.mobile'               "$RUNNER_TEMP/android-ui-smoke/logcat.txt"; then
              exit 1
            fi

      - name: Upload rendered UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmuse-android-ui-smoke
          path: ${{ runner.temp }}/android-ui-smoke
          if-no-files-found: warn
          retention-days: 7
