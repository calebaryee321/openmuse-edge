name: Android UI smoke

on:
  push:
    branches:
      - feature/openmuse-edge-v0
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: android-ui-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Download previously built APK artifact
        uses: actions/download-artifact@v4
        with:
          name: openmuse-android-smoke
          path: ${{ runner.temp }}/apk-source
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: calebaryee321/openmuse-edge
          run-id: 37331886172

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find "$RUNNER_TEMP/apk-source" -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true

      - name: Boot emulator, install APK, launch and capture UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            set -eux
            mkdir -p "$RUNNER_TEMP/android-ui-smoke"

            nohup pnpm --dir apps/mobile exec expo start --dev-client --localhost --port 8081               > "$RUNNER_TEMP/android-ui-smoke/metro.log" 2>&1 &

            timeout 120 bash -c 'until curl -fsS http://127.0.0.1:8081 >/dev/null; do sleep 2; done'

            adb reverse tcp:8081 tcp:8081
            adb install -r "${{ steps.apk.outputs.path }}"

            adb logcat -c
            adb shell am start -W -n app.openmuse.mobile/.MainActivity               > "$RUNNER_TEMP/android-ui-smoke/launcher-start.txt" 2>&1 || true
            sleep 3

            adb shell am start -W -a android.intent.action.VIEW               -d 'openmuse://expo-development-client/?url=http%3A%2F%2F10.0.2.2%3A8081&disableFab=1&disableAutoLaunch=1'               > "$RUNNER_TEMP/android-ui-smoke/launch.txt" 2>&1 || true
            sleep 30

            adb logcat -d > "$RUNNER_TEMP/android-ui-smoke/logcat.txt" || true
            adb shell dumpsys activity activities > "$RUNNER_TEMP/android-ui-smoke/activity.txt" || true
            adb shell dumpsys package app.openmuse.mobile > "$RUNNER_TEMP/android-ui-smoke/package.txt" || true
            adb exec-out screencap -p > "$RUNNER_TEMP/android-ui-smoke/openmuse-screen.png" || true
            adb shell uiautomator dump /sdcard/openmuse-ui.xml || true
            adb pull /sdcard/openmuse-ui.xml "$RUNNER_TEMP/android-ui-smoke/openmuse-ui.xml" || true

            PROCESS_LINE="$(adb shell ps -A 2>/dev/null | grep 'app.openmuse.mobile' || true)"
            printf '%s\n' "$PROCESS_LINE" | tee "$RUNNER_TEMP/android-ui-smoke/process.txt"

            test -s "$RUNNER_TEMP/android-ui-smoke/openmuse-screen.png"

            if grep -E 'FATAL EXCEPTION:|AndroidRuntime:.*Process: app\.openmuse\.mobile'               "$RUNNER_TEMP/android-ui-smoke/logcat.txt"; then
              echo "OpenMuse emitted a fatal Android exception."
              exit 1
            fi

            test -s "$RUNNER_TEMP/android-ui-smoke/openmuse-ui.xml"
            grep -Eq 'Welcome to OpenMuse|Open workspace|A little room for your day'               "$RUNNER_TEMP/android-ui-smoke/openmuse-ui.xml"

      - name: Upload rendered UI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmuse-android-ui-smoke
          path: ${{ runner.temp }}/android-ui-smoke
          if-no-files-found: warn
          retention-days: 7
