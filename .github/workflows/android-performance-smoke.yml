name: Android performance smoke

on:
  push:
    branches:
      - feature/openmuse-edge-v0
    paths:
      - ".github/workflows/android-performance-smoke.yml"
      - ".github/scripts/android-performance-smoke.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --clean --no-install

      - name: Verify Kotlin runtime alignment
        working-directory: apps/mobile/android
        shell: bash
        run: |
          ./gradlew :app:dependencyInsight --dependency org.jetbrains.kotlin:kotlin-reflect --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/kotlin-reflect.txt"
          ./gradlew :app:dependencyInsight --dependency org.jetbrains.kotlin:kotlin-stdlib --configuration releaseRuntimeClasspath > "$RUNNER_TEMP/kotlin-stdlib.txt"
          if grep -Eq 'kotlin-(reflect|stdlib)([^:]*):2\.4\.' "$RUNNER_TEMP/kotlin-reflect.txt" "$RUNNER_TEMP/kotlin-stdlib.txt"; then
            cat "$RUNNER_TEMP/kotlin-reflect.txt"
            cat "$RUNNER_TEMP/kotlin-stdlib.txt"
            exit 1
          fi

      - name: Build standalone release APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Measure startup, memory, CPU, frames, and relaunch stability
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 600
          script: bash .github/scripts/android-performance-smoke.sh "${{ steps.apk.outputs.path }}"

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmuse-edge-android-performance
          path: ${{ runner.temp }}/android-performance
          if-no-files-found: warn
          retention-days: 7
