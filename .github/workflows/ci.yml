name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --dir apps/worker typecheck
      - run: pnpm test
      - run: pnpm build:server
  platform:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [web, ios, android]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - name: Export platform bundle
        env:
          PLATFORM: ${{ matrix.platform }}
        run: pnpm --dir apps/mobile exec expo export --platform "$PLATFORM" --output-dir "dist/$PLATFORM"
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - name: Build Android APK
        run: |
          pnpm --dir apps/mobile exec expo prebuild --platform android --no-install
          apps/mobile/android/gradlew -p apps/mobile/android assembleRelease
      - name: Start isolated sample API
        env:
          CPK_INTELLIGENCE_API_KEY: android-smoke-test-project-key
          DATA_DIR: ${{ runner.temp }}/openmuse-android-smoke
        run: |
          nohup pnpm dev > "$RUNNER_TEMP/openmuse-api.log" 2>&1 </dev/null &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8787/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8787/api/health
      - name: Install and launch on Android emulator
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          script: |
            adb install apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p app.openmuse.mobile 1
            for attempt in $(seq 1 30); do
              if adb shell uiautomator dump /sdcard/window.xml >/dev/null 2>&1 &&
                adb shell cat /sdcard/window.xml | grep -Fq 'content-desc="Chat"'; then
                break
              fi
              sleep 1
            done
            UI=$(adb shell cat /sdcard/window.xml | tr -d '\r')
            for tab in Chat Activity Ideas Goals Apps; do
              printf '%s' "$UI" | grep -F "content-desc=\"$tab\""
            done
            if adb logcat -d -s AndroidRuntime ReactNativeJS | grep -E "FATAL EXCEPTION|Unhandled JS Exception"; then
              exit 1
            fi
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/worker exec playwright install --with-deps chromium
      - run: pnpm test:browser
  browser-container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node apps/worker/tests/run-docker.mjs
  computer-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - run: pnpm install --frozen-lockfile
      - name: Build the isolated Linux computer
        run: docker build -t openmuse-computer:local apps/computer
      - name: Verify computer isolation, persistence and cancellation
        run: pnpm test:computer
