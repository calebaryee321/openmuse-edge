name: Android installed smoke

# Candidate rebuild marker

on:
  push:
    branches:
      - feature/openmuse-edge-v0
    paths:
      - "apps/mobile/modules/openmuse-edge/**"
      - "apps/mobile/src/edge/**"
      - "apps/mobile/App.tsx"
      - "apps/mobile/app.json"
      - ".github/workflows/android-installed-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-installed-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Android JS bundle
        run: pnpm --dir apps/mobile build:android

      - name: Generate native Android project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build standalone test APK
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find apps/mobile/android/app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Boot emulator, install APK, and verify rendered UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -eu
            mkdir -p "$RUNNER_TEMP/android-smoke"

            adb install -r "${{ steps.apk.outputs.path }}"

            adb logcat -c
            adb shell monkey -p app.openmuse.mobile -c android.intent.category.LAUNCHER 1

            sleep 25

            adb logcat -d > "$RUNNER_TEMP/android-smoke/logcat.txt"
            adb shell dumpsys activity activities > "$RUNNER_TEMP/android-smoke/activity.txt"

            PID="$(adb shell pidof app.openmuse.mobile | tr -d '\r')"
            if [ -z "$PID" ]; then
              echo "OpenMuse process exited after launch."
              grep -E 'FATAL EXCEPTION:|AndroidRuntime|Fatal signal|Abort message|Process: app\.openmuse\.mobile|ReactNativeJS' "$RUNNER_TEMP/android-smoke/logcat.txt" || true
              exit 1
            fi
            echo "OpenMuse PID: $PID"

            adb shell uiautomator dump /sdcard/openmuse-ui.xml
            adb pull /sdcard/openmuse-ui.xml "$RUNNER_TEMP/android-smoke/openmuse-ui.xml"

            adb exec-out screencap -p > "$RUNNER_TEMP/android-smoke/openmuse-screen.png"

            test -s "$RUNNER_TEMP/android-smoke/openmuse-screen.png"
            test -s "$RUNNER_TEMP/android-smoke/openmuse-ui.xml"

            grep -Eq 'Welcome to OpenMuse|Open workspace|A little room for your day|Open Device AI' "$RUNNER_TEMP/android-smoke/openmuse-ui.xml"

            if grep -E 'FATAL EXCEPTION:|AndroidRuntime:.*Process: app\.openmuse\.mobile|Fatal signal.*app\.openmuse\.mobile|Abort message' "$RUNNER_TEMP/android-smoke/logcat.txt"; then
              echo "OpenMuse crashed during standalone installed-app smoke test."
              exit 1
            fi

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-smoke"
          cp "${{ steps.apk.outputs.path }}" "$RUNNER_TEMP/android-smoke/openmuse-edge-standalone-test.apk" 2>/dev/null || true

      - name: Upload APK, screenshot, UI tree and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmuse-edge-standalone-test
          path: ${{ runner.temp }}/android-smoke
          if-no-files-found: warn
          retention-days: 7
