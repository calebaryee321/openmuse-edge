name: Android installed smoke

on:
  push:
    branches:
      - feature/openmuse-edge-v0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-installed-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate existing Android bundle
        run: pnpm --dir apps/mobile build:android

      - name: Generate native Android project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build installable development APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find apps/mobile/android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Expose Android SDK command-line tools
        shell: bash
        run: |
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/emulator" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "sdkmanager=$SDKMANAGER"

      - name: Install Android emulator image
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "system-images;android-35;google_apis;x86_64"

      - name: Enable KVM
        shell: bash
        run: |
          sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null <<'RULE'
          KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"
          RULE
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm || true

      - name: Create emulator
        shell: bash
        run: |
          echo no | avdmanager create avd             --force             --name openmuse-ci             --package "system-images;android-35;google_apis;x86_64"             --device "pixel_7"

      - name: Boot emulator
        shell: bash
        run: |
          nohup emulator             -avd openmuse-ci             -no-window             -noaudio             -no-boot-anim             -gpu swiftshader_indirect             -no-snapshot             > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 5; done'
          adb shell input keyevent 82 || true
          adb devices -l

      - name: Start sample OpenMuse API
        shell: bash
        env:
          CPK_INTELLIGENCE_API_KEY: ci-placeholder-key
        run: |
          nohup pnpm dev > "$RUNNER_TEMP/openmuse-api.log" 2>&1 &
          timeout 60 bash -c 'until curl -fsS http://127.0.0.1:8787/api/health >/dev/null; do sleep 2; done'

      - name: Start Metro dev server
        shell: bash
        run: |
          nohup pnpm --dir apps/mobile exec expo start --dev-client --localhost --port 8081             > "$RUNNER_TEMP/metro.log" 2>&1 &
          timeout 90 bash -c 'until curl -fsS http://127.0.0.1:8081 >/dev/null; do sleep 2; done'
          adb reverse tcp:8081 tcp:8081
          adb reverse tcp:8787 tcp:8787

      - name: Install and launch APK
        shell: bash
        run: |
          adb install -r "${{ steps.apk.outputs.path }}"
          adb logcat -c
          adb shell monkey -p app.openmuse.mobile -c android.intent.category.LAUNCHER 1
          sleep 15
          adb shell pidof app.openmuse.mobile
          adb shell dumpsys activity activities | grep -F "app.openmuse.mobile" | head -n 20

      - name: Verify core UI is rendered
        shell: bash
        run: |
          adb shell uiautomator dump /sdcard/openmuse-ui.xml
          adb pull /sdcard/openmuse-ui.xml "$RUNNER_TEMP/openmuse-ui.xml"
          cat "$RUNNER_TEMP/openmuse-ui.xml"
          grep -Eq 'text="Chat"|content-desc="Chat"' "$RUNNER_TEMP/openmuse-ui.xml"
          grep -Eq 'text="Activity"|content-desc="Activity"' "$RUNNER_TEMP/openmuse-ui.xml"
          grep -Eq 'text="Apps"|content-desc="Apps"' "$RUNNER_TEMP/openmuse-ui.xml"

      - name: Fail on fatal Android crash
        if: always()
        shell: bash
        run: |
          adb logcat -d > "$RUNNER_TEMP/logcat.txt" || true
          if grep -E "FATAL EXCEPTION:|AndroidRuntime:.*Process: app\.openmuse\.mobile" "$RUNNER_TEMP/logcat.txt"; then
            echo "OpenMuse crashed during installed-app smoke test."
            exit 1
          fi

      - name: Collect smoke artifacts
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-smoke"
          cp "${{ steps.apk.outputs.path }}" "$RUNNER_TEMP/android-smoke/openmuse-debug.apk" 2>/dev/null || true
          cp "$RUNNER_TEMP/openmuse-ui.xml" "$RUNNER_TEMP/android-smoke/" 2>/dev/null || true
          cp "$RUNNER_TEMP/logcat.txt" "$RUNNER_TEMP/android-smoke/" 2>/dev/null || true
          cp "$RUNNER_TEMP/emulator.log" "$RUNNER_TEMP/android-smoke/" 2>/dev/null || true
          cp "$RUNNER_TEMP/openmuse-api.log" "$RUNNER_TEMP/android-smoke/" 2>/dev/null || true
          cp "$RUNNER_TEMP/metro.log" "$RUNNER_TEMP/android-smoke/" 2>/dev/null || true

      - name: Upload APK and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmuse-android-smoke
          path: ${{ runner.temp }}/android-smoke
          if-no-files-found: warn
          retention-days: 7
