name: Android installed smoke

# Candidate rebuild marker

on:
  push:
    branches:
      - feature/openmuse-edge-v0
    paths:
      - "apps/mobile/modules/openmuse-edge/**"
      - "apps/mobile/src/edge/**"
      - "apps/mobile/App.tsx"
      - "apps/mobile/app.json"
      - ".github/workflows/android-installed-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-installed-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: pnpm
        uses: pnpm/action-setup@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Android JS bundle
        run: pnpm --dir apps/mobile build:android

      - name: Generate native Android project
        run: pnpm --dir apps/mobile exec expo prebuild --platform android --clean --no-install

      - name: Build installable debug APK
        working-directory: apps/mobile/android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        shell: bash
        run: |
          APK="$(find apps/mobile/android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Boot emulator, install APK, and verify rendered UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euxo pipefail
            mkdir -p "$RUNNER_TEMP/android-smoke"

            nohup pnpm --dir apps/mobile exec expo start --dev-client --localhost --port 8081               > "$RUNNER_TEMP/android-smoke/metro.log" 2>&1 &

            timeout 120 bash -c 'until curl -fsS http://127.0.0.1:8081 >/dev/null; do sleep 2; done'

            adb reverse tcp:8081 tcp:8081
            adb install -r "${{ steps.apk.outputs.path }}"

            adb logcat -c
            adb shell monkey -p app.openmuse.mobile -c android.intent.category.LAUNCHER 1

            sleep 25

            PID="$(adb shell pidof app.openmuse.mobile | tr -d '\r')"
            test -n "$PID"
            echo "OpenMuse PID: $PID"

            adb shell dumpsys activity activities               > "$RUNNER_TEMP/android-smoke/activity.txt"

            adb shell uiautomator dump /sdcard/openmuse-ui.xml
            adb pull /sdcard/openmuse-ui.xml "$RUNNER_TEMP/android-smoke/openmuse-ui.xml"

            adb exec-out screencap -p               > "$RUNNER_TEMP/android-smoke/openmuse-screen.png"

            adb logcat -d               > "$RUNNER_TEMP/android-smoke/logcat.txt"

            test -s "$RUNNER_TEMP/android-smoke/openmuse-screen.png"
            test -s "$RUNNER_TEMP/android-smoke/openmuse-ui.xml"

            grep -Eq 'Welcome to OpenMuse|Open workspace|A little room for your day'               "$RUNNER_TEMP/android-smoke/openmuse-ui.xml"

            if grep -E 'FATAL EXCEPTION:|AndroidRuntime:.*Process: app\.openmuse\.mobile'               "$RUNNER_TEMP/android-smoke/logcat.txt"; then
              echo "OpenMuse crashed during installed-app smoke test."
              exit 1
            fi

      - name: Collect APK
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-smoke"
          cp "${{ steps.apk.outputs.path }}"             "$RUNNER_TEMP/android-smoke/openmuse-debug.apk" 2>/dev/null || true

      - name: Upload APK, screenshot, UI tree and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openmuse-android-smoke
          path: ${{ runner.temp }}/android-smoke
          if-no-files-found: warn
          retention-days: 7
