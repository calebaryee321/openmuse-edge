plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.openmuse.edge'
version = '0.1.0'

android {
  namespace "app.openmuse.edge"

  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // 0.13.1 stays on the Kotlin 2.2-era runtime used by Expo SDK 54.
  // Newer LiteRT-LM 0.17.x requires kotlin-reflect 2.4.x and is not safe
  // to mix into this app's Kotlin 2.2 toolchain.
  implementation "com.google.ai.edge.litertlm:litertlm-android:0.13.1"
  implementation "androidx.work:work-runtime-ktx:2.12.0"
}
